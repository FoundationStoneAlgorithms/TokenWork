name: Bug report
description: Report something that is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security vulnerabilities, **do not** open a public issue — see [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include commands, inputs, or a minimal example.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Environment / context
      description: OS, versions, branch/commit, component (backend, chain, frontend, agents, docs), etc.
    validations:
      required: false

name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What problem does this solve, or what outcome do you want?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the change you'd like. Link to the relevant PRD/roadmap section or issue if applicable.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Constraints, alternatives considered, risks, or compliance/legal notes.
    validations:
      required: false
